syntax = "proto3";

package social;

option go_package = "./social";

// 单向关注关系模型（类似微博/抖音）：
// A 关注 B 是一条独立记录，不要求 B 反向关注 A。
// follower_id = 主动关注者，following_id = 被关注者。

message FollowReq {
  uint64 follower_id = 1; // 主动关注者，必须由 gateway 从 JWT 解析填入
  uint64 following_id = 2; // 被关注者
}

message FollowResp {
  string msg = 1;
  bool followed = 2;
}

message UnfollowReq {
  uint64 follower_id = 1;
  uint64 following_id = 2;
}

message UnfollowResp {
  string msg = 1;
  bool unfollowed = 2;
}

// 查询 follower_id 是否关注了 following_id。
message IsFollowingReq {
  uint64 follower_id = 1;
  uint64 following_id = 2;
}

message IsFollowingResp {
  bool following = 1;
}

// 分页游标按 updated_at DESC, id DESC 排序。
// 软删除关系重新关注时 updated_at 会更新，因此能够重新出现在列表前面。
message ListFollowersReq {
  uint64 user_id = 1; // 被关注者，查询其粉丝列表
  uint64 viewer_id = 2; // 当前查看者，0 表示未登录
  int64 cursor_updated_at = 3;
  uint64 cursor_follow_id = 4;
  int64 page_size = 5;
}

message FollowRelation {
  uint64 relation_id = 1;
  uint64 follower_id = 2;
  uint64 following_id = 3;
  int64 followed_at = 4; // 关系最近生效时间，Unix milliseconds
  bool viewer_is_following = 5;
}

message ListFollowersResp {
  repeated FollowRelation followers = 1;
  int64 next_cursor_updated_at = 2;
  uint64 next_cursor_follow_id = 3;
  bool has_more = 4;
}

message ListFollowingsReq {
  uint64 user_id = 1; // 主动关注者，查询其关注列表
  uint64 viewer_id = 2; // 当前查看者，0 表示未登录
  int64 cursor_updated_at = 3;
  uint64 cursor_follow_id = 4;
  int64 page_size = 5;
}

message ListFollowingsResp {
  repeated FollowRelation followings = 1;
  int64 next_cursor_updated_at = 2;
  uint64 next_cursor_follow_id = 3;
  bool has_more = 4;
}

message FollowingState {
  uint64 target_user_id = 1;
  bool following = 2;
}

// Feed/推荐列表批量判断当前查看者是否关注多个作者，避免 N+1 RPC。
message BatchIsFollowingReq {
  uint64 viewer_id = 1; // 0 表示未登录
  repeated uint64 target_user_ids = 2;
}

message BatchIsFollowingResp {
  repeated FollowingState states = 1;
}

message GetFollowStatsReq {
  uint64 user_id = 1;
}

message GetFollowStatsResp {
  int64 followers_count = 1;
  int64 followings_count = 2;
}

// 社交关系服务
service Social {
  //关注
  rpc Follow(FollowReq) returns (FollowResp);
  //取关
  rpc Unfollow(UnfollowReq) returns (UnfollowResp);
  //判断是否关注
  rpc IsFollowing(IsFollowingReq) returns (IsFollowingResp);
  //展示粉丝
  rpc ListFollowers(ListFollowersReq) returns (ListFollowersResp);
  //展示关注
  rpc ListFollowings(ListFollowingsReq) returns (ListFollowingsResp);
  //批量获取关注信息
  rpc BatchIsFollowing(BatchIsFollowingReq) returns (BatchIsFollowingResp);
  //获取关注数量
  rpc GetFollowStats(GetFollowStatsReq) returns (GetFollowStatsResp);
}
