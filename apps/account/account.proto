syntax = "proto3";

package account;
option go_package = "./account";

   //验证服务
message VerificationReq{
    string email=1;
  }
message VerificationResp{
    string verification=1;
  }

  //注册服务
message RegisterReq{
    string username=1;
    string password=2;
    string email=3;
    string verification=4;
  }
message RegisterResp{
    string msg =1;
  }
  
  //登录服务
message LoginReq{
    string username=1;
    string password=2;
  }
message LoginResp{
    string access_token=1;
    string refresh_token=2;
  }

  //登出服务
message LogoutReq{
    uint64 user_id=1;
  }
message LogoutResp{
    string msg=1;
  }

  //刷新token
  message RefreshTokenReq {
    string refresh_token = 1;
  }
  
  message RefreshTokenResp {
    string access_token = 1;
    string refresh_token = 2;
  }
  
  //获取用户信息
  message GetProfileReq {
    uint64 user_id = 1;
  }
  
  message GetProfileResp {
    uint64 user_id = 1;
    string username = 2;
    string email = 3;
    string avatar_url = 4;
    string bio = 5;
    int64 follower_count = 6; // 粉丝数，来自 accounts.follower_count 冗余字段
    int64 following_count = 7; // 关注数，来自 accounts.following_count 冗余字段
  }

  // 公开用户资料，不包含邮箱、密码和 token 等敏感字段。
  message PublicProfile {
    uint64 user_id = 1;
    string username = 2;
    string avatar_url = 3;
    string bio = 4;
    int64 follower_count = 5; // 粉丝数，来自 accounts.follower_count 冗余字段
    int64 following_count = 6; // 关注数，来自 accounts.following_count 冗余字段
  }

  // 给 gateway/social 等内部服务批量补齐用户资料，避免逐个 RPC 造成 N+1。
  message BatchGetProfilesReq {
    repeated uint64 user_ids = 1;
  }

  message BatchGetProfilesResp {
    repeated PublicProfile profiles = 1;
  }
  
  //更新用户信息
  message UpdateProfileReq {
    uint64 user_id = 1;
    string username = 2;
    string avatar_url = 3; //头像地址
    optional string bio = 4; //用户个人简介，传空字符串表示清空
  }
  
  message UpdateProfileResp {
    string msg = 1;
  }
  //处理相应服务
service Account {
  //验证码
  rpc SendVerification(VerificationReq) returns (VerificationResp);
  //注册
  rpc Register(RegisterReq) returns (RegisterResp);
  //登录
  rpc Login(LoginReq) returns (LoginResp);
  //登出
  rpc Logout(LogoutReq) returns (LogoutResp);
  //刷新token
  rpc RefreshToken(RefreshTokenReq)  returns (RefreshTokenResp);
  //查用户
  rpc GetProfile(GetProfileReq) returns (GetProfileResp);
  //批量查询公开用户资料
  rpc BatchGetProfiles(BatchGetProfilesReq) returns (BatchGetProfilesResp);
  //更新用户信息
  rpc UpdateProfile(UpdateProfileReq) returns (UpdateProfileResp);
}
