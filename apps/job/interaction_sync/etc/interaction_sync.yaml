Name: interaction-sync.job

Mysql:
  DataSource: root:123456@tcp(127.0.0.1:3308)/feedsystem_zero?charset=utf8mb4&parseTime=true&loc=Local

Kafka:
  Brokers:
    - 127.0.0.1:9094
  GroupID: interaction-sync-job
  Topics:
    - interaction.like.events
    - interaction.comment.events
  MinBytes: 1
  MaxBytes: 10485760
  MaxWaitMs: 1000
  CommitInterval: 0
  BatchSize: 100
  FlushMs: 1000

InteractionRpc:
  Etcd:
    Hosts:
      - 127.0.0.1:23790
    Key: interaction.rpc

Sync:
  BatchSize: 100
  FlushMs: 1000
  FlushBatchSize: 500
  RpcTimeoutMs: 10000
  WorkerCount: 4
  MaxEventRetry: 3
  RetryBackoffMs: 200
  MaxRetryBackoffMs: 2000
