Name: hotrank.job

Mysql:
  DataSource: root:123456@tcp(127.0.0.1:3308)/feedsystem_zero?charset=utf8mb4&parseTime=true&loc=Local

BizRedis:
  Addr: 127.0.0.1:6380
  Password: "123456"
  DB: 0

Kafka:
  Brokers:
    - 127.0.0.1:9094
  GroupID: hotrank-job
  Topics:
    - interaction.like.events
    - interaction.comment.events
  MinBytes: 1
  MaxBytes: 10485760
  MaxWaitMs: 1000
  CommitInterval: 0
  BatchSize: 100
  FlushMs: 1000

HotRank:
  BatchSize: 100
  FlushMs: 1000
  WorkerCount: 4
  # 分钟窗口保留 2 小时，需覆盖 GetHotFeed 聚合窗口及分页快照使用时间。
  WindowRetentionSeconds: 7200
  ProcessedEventTTLDays: 14
  RedisOpTimeoutMs: 1000
  DBWriteTimeoutMs: 3000
  FutureToleranceSeconds: 300
