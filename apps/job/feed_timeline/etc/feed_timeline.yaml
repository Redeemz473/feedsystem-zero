Name: feed-timeline.job

Mysql:
  DataSource: root:123456@tcp(127.0.0.1:3308)/feedsystem_zero?charset=utf8mb4&parseTime=true&loc=Local

BizRedis:
  Addr: 127.0.0.1:6380
  Password: "123456"
  DB: 0

Kafka:
  Brokers:
    - 127.0.0.1:9094
  GroupID: feed-timeline-job
  Topics:
    - feed.video.events
    - social.follow.events
  MinBytes: 1
