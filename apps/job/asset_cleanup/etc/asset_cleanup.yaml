Name: asset-cleanup.job

Mysql:
  DataSource: root:123456@tcp(127.0.0.1:3308)/feedsystem_zero?charset=utf8mb4&parseTime=true&loc=Local

BizRedis:
  Addr: 127.0.0.1:6380
  Password: "123456"
  DB: 0

# 必须与 gateway 的 Upload.Dir 指向同一个本地目录。
# README 默认从仓库根目录启动所有进程，因此两边都使用 uploads。
Upload:
  Dir: uploads

AssetCleanup:
  BatchSize: 100
  PollIntervalSeconds: 30
  GraceSeconds: 300
  ClaimTimeoutSeconds: 300
  DeleteTimeoutMs: 5000
  # 分批校准 Active 资产的真实视频引用，并检查磁盘文件是否仍然存在。
  ReconcileBatchSize: 200
  ReconcileIntervalSeconds: 60
