Name: outbox.job

Mysql:
  DataSource: root:123456@tcp(127.0.0.1:3308)/feedsystem_zero?charset=utf8mb4&parseTime=true&loc=Local

Kafka:
  Brokers:
    - 127.0.0.1:9094
  RequiredAcks: 1
  BatchSize: 100
  BatchBytes: 1048576
  FlushMs: 20
  RetryMax: 3

Outbox:
  # 批量 claim、批量发布和批量回写共同降低高峰期的 DB/Kafka 往返次数。
  BatchSize: 500
  WorkerCount: 16
  PollIntervalMs: 100
  MaxRetry: 10
  RetryBaseMs: 1000
  RetryMaxMs: 60000
  ClaimTimeoutSeconds: 60
  EventTimeoutMs: 10000
  PublishTimeoutMs: 5000
