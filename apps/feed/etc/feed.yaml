Name: feed.rpc
ListenOn: 0.0.0.0:9005
Etcd:
  Hosts:
  - 127.0.0.1:23790
  Key: feed.rpc

Mysql:
  DataSource: root:123456@tcp(127.0.0.1:3308)/feedsystem_zero?charset=utf8mb4&parseTime=true&loc=Local

BizRedis:
  Addr: 127.0.0.1:6380
  Password: "123456"
  DB: 0

Timeline:
  DefaultPageSize: 20
  MaxPageSize: 50
  GlobalTimelineMaxLen: 10000
  UserTimelineMaxLen: 2000
  UserTimelineTTLSeconds: 2592000
  BuildLockTTLSeconds: 15
  BuildWaitMs: 1500
  RedisOpTimeoutMs: 1000
  DBQueryTimeoutMs: 3000

HotRank:
  # 聚合最近 60 个 UTC 分钟窗口，越早的窗口按 30 分钟半衰期衰减。
  WindowMinutes: 60
  MaxRankSize: 1000
  DecayHalfLifeMinutes: 30
  # 快照最多保留、回看 30 分钟；配合 job 的 2 小时窗口保留时间使用。
  SnapshotTTLSeconds: 1800
  MaxSnapshotAgeSeconds: 1800
  BuildLockTTLSeconds: 10
  BuildWaitMs: 1200
  RedisOpTimeoutMs: 1000
  FutureToleranceSeconds: 300
